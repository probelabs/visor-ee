# =============================================================================
# assistant: High-level AI Assistant Workflow
# =============================================================================
#
# A declarative, batteries-included workflow for building AI assistants.
# Combines intent routing, dynamic tool selection, knowledge embedding,
# and code exploration into a single configurable workflow.
#
# Just declare your:
#   - Intents and tags
#   - Knowledge documents (mapped to tags)
#   - MCP servers (mapped to tags)
#   - Code configuration (optional)
#
# The workflow handles all the wiring automatically.
#
# Usage:
#   imports:
#     - visor-ee://workflows/assistant.yaml
#
#   checks:
#     chat:
#       type: workflow
#       workflow: assistant
#       args:
#         question: "{{ outputs['ask'].text }}"
#         intents:
#           - id: chat
#             description: general Q&A
#         tags:
#           - id: jira
#             description: needs Jira access
#         knowledge:
#           - tags: [capabilities]
#             content: "I can help with..."
#         mcp_servers:
#           - tags: [jira]
#             server:
#               command: uvx
#               args: [mcp-atlassian]
#
# =============================================================================

id: assistant
name: AI Assistant
description: |
  High-level AI assistant workflow with declarative configuration.
  Handles intent routing, dynamic tools, and knowledge injection automatically.
version: "1.0.0"

# Note: These imports are relative to this file's location
# When importing assistant.yaml from a URL, these become relative URLs
imports:
  - intent-router.yaml
  - code-talk.yaml

inputs:
  # =========================================================================
  # Core Input
  # =========================================================================
  - name: question
    required: true
    description: The user's question/message
    schema:
      type: string

  - name: history
    required: false
    description: Conversation history (array of {role, text})
    default: []
    schema:
      type: array

  # =========================================================================
  # Intent & Tag Configuration
  # =========================================================================
  - name: intents
    required: true
    description: |
      Array of intent definitions for routing:
        - id: unique identifier
        - description: when to use this intent
    schema:
      type: array
      items:
        type: object
        properties:
          id: { type: string }
          description: { type: string }
        required: [id, description]

  - name: tags
    required: false
    description: |
      Array of tag definitions for capability classification:
        - id: unique identifier
        - description: when to apply this tag
    default: []
    schema:
      type: array
      items:
        type: object
        properties:
          id: { type: string }
          description: { type: string }
        required: [id, description]

  - name: routing_instructions
    required: false
    description: Additional routing rules for the intent classifier
    default: ""
    schema:
      type: string

  # =========================================================================
  # Knowledge Configuration
  # =========================================================================
  - name: knowledge
    required: false
    description: |
      Array of knowledge documents to inject based on tags:
        - tags: array of tag IDs that trigger this knowledge
        - content: the knowledge content to inject
        - intent: (optional) specific intent that triggers this
    default: []
    schema:
      type: array
      items:
        type: object
        properties:
          tags:
            type: array
            items: { type: string }
          intent:
            type: string
          content:
            type: string
        required: [content]

  # =========================================================================
  # MCP Server Configuration
  # =========================================================================
  - name: mcp_servers
    required: false
    description: |
      Array of MCP servers to enable based on tags:
        - tags: array of tag IDs that trigger this server
        - intent: (optional) specific intent that triggers this
        - name: server name (used as key in ai_mcp_servers)
        - server: MCP server configuration object
          For external servers: { command, args, env, allowedMethods }
          For workflow tools: { workflow, inputs }
          For built-in tools: { tool: 'tool-name' }
    default: []
    schema:
      type: array
      items:
        type: object
        properties:
          tags:
            type: array
            items: { type: string }
          intent:
            type: string
          name:
            type: string
          server:
            type: object
        required: [name, server]

  # =========================================================================
  # Skills Configuration (unified knowledge + tools)
  # =========================================================================
  - name: skills
    required: false
    description: |
      Array of skill definitions that bundle knowledge and MCP servers together.
      Each skill combines related functionality in one place:
        - id: unique skill identifier
        - tags: array of tag IDs that trigger this skill
        - intent: (optional) specific intent that triggers this skill
        - name: server name for the MCP tool
        - knowledge: knowledge content to inject when skill is active
        - server: (optional) MCP server configuration
          For external servers: { command, args, env, allowedMethods }
          For workflow tools: { workflow, inputs }
          For built-in tools: { tool: 'tool-name' }

      Skills are merged with standalone knowledge[] and mcp_servers[] configs.
    default: []
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          tags:
            type: array
            items: { type: string }
          intent:
            type: string
          name:
            type: string
          knowledge:
            type: string
          server:
            type: object
        required: [id]

  # =========================================================================
  # Code Exploration Configuration
  # =========================================================================
  - name: code_config
    required: false
    description: |
      Configuration for code exploration (enables code-talk tool):
        - enabled: whether to enable code exploration
        - tags: which tags trigger code exploration (default: [codebase])
        - intents: which intents trigger code exploration (default: [code_help])
        - architecture: architecture documentation
        - docs_repo: documentation repository (owner/repo)
        - docs_ref: git ref for docs (default: main)
        - projects: array of code projects
        - max_projects: maximum projects to checkout
        - routing_prompt: additional routing instructions
        - exploration_prompt: additional exploration instructions
    schema:
      type: object
      properties:
        enabled: { type: boolean }
        tags:
          type: array
          items: { type: string }
        intents:
          type: array
          items: { type: string }
        architecture: { type: string }
        docs_repo: { type: string }
        docs_ref: { type: string }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              repo: { type: string }
              description: { type: string }
        max_projects: { type: number }
        routing_prompt: { type: string }
        exploration_prompt: { type: string }

  # =========================================================================
  # AI Configuration
  # =========================================================================
  - name: system_prompt
    required: false
    description: Base system prompt for the AI
    default: "You are a helpful AI assistant."
    schema:
      type: string

  - name: guidelines
    required: false
    description: Guidelines to append to the prompt
    default: ""
    schema:
      type: string

  - name: max_iterations
    required: false
    description: Maximum AI iterations
    default: 30
    schema:
      type: number

# =========================================================================
# Outputs
# =========================================================================
outputs:
  - name: text
    description: The AI response text
    value_js: |
      return outputs?.['generate-response']?.text ?? null;

  - name: intent
    description: The classified intent
    value_js: |
      return outputs?.['route-intent']?.intent ?? null;

  - name: tags
    description: The classified tags
    value_js: |
      return outputs?.['route-intent']?.tags ?? [];

  - name: topic
    description: The rewritten topic/question
    value_js: |
      return outputs?.['route-intent']?.topic ?? null;

# =========================================================================
# Steps
# =========================================================================
steps:
  # -------------------------------------------------------------------------
  # Step 1: Route intent and classify skills (or tags for backwards compat)
  # -------------------------------------------------------------------------
  route-intent:
    type: workflow
    workflow: intent-router
    criticality: internal
    assume:
      - "true"
    guarantee: "output?.intent != null"
    args:
      question: "{{ inputs.question }}"
      # Use expression syntax to pass arrays directly (not as JSON strings)
      intents:
        expression: "inputs.intents"
      # Pass skills if provided (unified mode), otherwise fall back to tags
      skills:
        expression: |
          // If skills have descriptions, pass them for classification
          const skills = inputs.skills || [];
          // Extract id and description for classification
          return skills.filter(s => s.description).map(s => ({
            id: s.id,
            description: s.description,
            requires: s.requires || []
          }));
      tags:
        expression: "inputs.tags || []"
      routing_instructions: "{{ inputs.routing_instructions }}"

  # -------------------------------------------------------------------------
  # Step 2: Build dynamic configuration for the AI step
  # -------------------------------------------------------------------------
  build-config:
    type: script
    criticality: internal
    depends_on: [route-intent]
    assume:
      - "outputs['route-intent'] != null"
    schema:
      type: object
      properties:
        mcp_servers:
          type: object
        knowledge_content:
          type: string
    content: |
      const intent = outputs['route-intent']?.intent ?? '';
      const tags = outputs['route-intent']?.tags ?? [];
      const question = inputs.question ?? '';

      // Get activated skill IDs from router and expand dependencies
      const rawSelectedSkills = outputs['route-intent']?.skills ?? [];
      const skillConfigs = Array.isArray(inputs.skills) ? inputs.skills : [];

      // Build requires map for dependency expansion
      const requiresMap = {};
      for (let i = 0; i < skillConfigs.length; i++) {
        const skill = skillConfigs[i];
        if (skill.id && Array.isArray(skill.requires)) {
          requiresMap[skill.id] = skill.requires;
        }
      }

      // Expand selected skills to include their dependencies using array
      const activatedSkillsArr = Array.isArray(rawSelectedSkills) ? rawSelectedSkills.slice() : [];
      let changed = true;
      while (changed) {
        changed = false;
        const currentSkills = activatedSkillsArr.slice();
        for (let i = 0; i < currentSkills.length; i++) {
          const skillId = currentSkills[i];
          const deps = requiresMap[skillId] || [];
          for (let j = 0; j < deps.length; j++) {
            const dep = deps[j];
            if (activatedSkillsArr.indexOf(dep) === -1) {
              activatedSkillsArr.push(dep);
              changed = true;
            }
          }
        }
      }

      const activatedSkills = activatedSkillsArr;
      const activatedSkillSet = {};
      for (let i = 0; i < activatedSkills.length; i++) {
        activatedSkillSet[activatedSkills[i]] = true;
      }

      // Helper function to check if tags/intent match (for backwards compatibility)
      function shouldActivateByTagsOrIntent(itemTags, itemIntent) {
        // Check if any tag matches
        if (itemTags && itemTags.length > 0) {
          for (const tag of itemTags) {
            if (tags.includes(tag)) {
              return true;
            }
          }
        }
        // Check if intent matches
        if (itemIntent && intent === itemIntent) {
          return true;
        }
        return false;
      }

      // Build MCP servers and knowledge from skills + standalone configs
      const servers = {};
      const knowledgeParts = [];

      // =========================================================================
      // Process skills - check by ID if skills mode, or by tags/intent otherwise
      // =========================================================================
      const usingSkillsMode = activatedSkills.length > 0;

      // Track code_config from skills (skill-based code config takes precedence)
      let skillCodeConfig = null;

      for (const skill of skillConfigs) {
        let isActive = false;

        if (usingSkillsMode) {
          // Skills mode: check if this skill ID was selected by the router
          isActive = activatedSkillSet[skill.id] === true;
        } else {
          // Legacy mode: check by tags/intent
          const skillTags = Array.isArray(skill.tags) ? skill.tags : [];
          const skillIntent = skill.intent;
          isActive = shouldActivateByTagsOrIntent(skillTags, skillIntent);
        }

        if (isActive) {
          // Add knowledge if present
          if (skill.knowledge) {
            knowledgeParts.push(skill.knowledge);
          }

          // Add server if present (but not if skill has code_config - that's handled separately)
          if (skill.server && skill.name && !skill.code_config) {
            servers[skill.name] = skill.server;
          }

          // Extract code_config from skill if present
          if (skill.code_config) {
            skillCodeConfig = skill.code_config;
          }
        }
      }

      // =========================================================================
      // Process standalone MCP servers (for backwards compatibility)
      // =========================================================================
      const mcpConfigs = Array.isArray(inputs.mcp_servers) ? inputs.mcp_servers : [];
      for (const config of mcpConfigs) {
        const serverTags = Array.isArray(config.tags) ? config.tags : [];
        const serverIntent = config.intent;
        const serverName = config.name;
        const serverConfig = config.server;

        if (!serverName || !serverConfig) continue;

        // Check if this server should be enabled
        let shouldEnable = shouldActivateByTagsOrIntent(serverTags, serverIntent);

        // If no tags or intent specified, always enable
        if (serverTags.length === 0 && !serverIntent) {
          shouldEnable = true;
        }

        if (shouldEnable) {
          servers[serverName] = serverConfig;
        }
      }

      // =========================================================================
      // Process code_config - add code-talk as a tool if enabled
      // Supports both inputs.code_config (legacy) and skill.code_config (unified)
      // =========================================================================
      const codeConfig = skillCodeConfig ?? inputs.code_config;
      if (codeConfig?.enabled) {
        const codeTags = codeConfig.tags ?? ['codebase'];
        const codeIntents = codeConfig.intents ?? ['code_help'];

        let shouldEnableCode = false;

        // If code_config came from an activated skill, it's already enabled
        if (skillCodeConfig) {
          shouldEnableCode = true;
        } else {
          // Legacy mode: check tags/intents
          for (const tag of codeTags) {
            if (tags.includes(tag)) {
              shouldEnableCode = true;
              break;
            }
          }
          if (codeIntents.includes(intent)) {
            shouldEnableCode = true;
          }
        }

        if (shouldEnableCode) {
          servers['code-explorer'] = {
            workflow: 'code-talk',
            inputs: {
              question: question,
              architecture: codeConfig.architecture ?? '',
              docs_repo: codeConfig.docs_repo ?? '',
              docs_ref: codeConfig.docs_ref ?? 'main',
              projects: codeConfig.projects ?? [],
              max_projects: codeConfig.max_projects ?? 3,
              routing_prompt: codeConfig.routing_prompt ?? '',
              exploration_prompt: codeConfig.exploration_prompt ?? ''
            }
          };
        }
      }

      // =========================================================================
      // Process standalone knowledge (for backwards compatibility)
      // =========================================================================
      const knowledgeConfigs = Array.isArray(inputs.knowledge) ? inputs.knowledge : [];

      for (const config of knowledgeConfigs) {
        const knowledgeTags = Array.isArray(config.tags) ? config.tags : [];
        const knowledgeIntent = config.intent;
        const content = config.content;

        if (!content) continue;

        let shouldInclude = shouldActivateByTagsOrIntent(knowledgeTags, knowledgeIntent);

        if (shouldInclude) {
          knowledgeParts.push(content);
        }
      }

      return {
        mcp_servers: servers,
        knowledge_content: knowledgeParts.join('\n\n')
      };

  # -------------------------------------------------------------------------
  # Step 3: Generate response with dynamic tools and knowledge
  # -------------------------------------------------------------------------
  generate-response:
    type: ai
    criticality: internal
    depends_on: [route-intent, build-config]
    assume:
      - "outputs['route-intent'] != null"
      - "outputs['build-config'] != null"
    guarantee: "(output?.text ?? '').length > 0"
    ai:
      max_iterations: "{{ inputs.max_iterations }}"
      skip_code_context: true
    ai_mcp_servers_js: |
      // Return the pre-built MCP servers from build-config
      return outputs['build-config']?.mcp_servers ?? {};
    schema:
      type: object
      properties:
        text:
          type: string
          description: The response to the user
      required: [text]
    prompt: |
      {{ inputs.system_prompt }}

      {% if inputs.history and inputs.history.size > 0 %}
      <history>
      {% for m in inputs.history %}
      {{ m.role | capitalize }}: {{ m.text }}
      {% endfor %}
      </history>
      {% endif %}

      ## Current Request
      User: {{ inputs.question }}

      ## Classification
      Intent: {{ outputs['route-intent'].intent }}
      {% if outputs['route-intent'].tags and outputs['route-intent'].tags.size > 0 %}
      Tags: {{ outputs['route-intent'].tags | join: ', ' }}
      {% endif %}

      {% if outputs['build-config'].knowledge_content and outputs['build-config'].knowledge_content != '' %}
      {{ outputs['build-config'].knowledge_content }}
      {% endif %}

      {% if inputs.guidelines and inputs.guidelines != '' %}
      ## Guidelines
      {{ inputs.guidelines }}
      {% endif %}

# =============================================================================
# Tests
# =============================================================================
tests:
  defaults:
    strict: true
    ai_provider: mock

  cases:
    # =========================================================================
    # Basic Routing Tests
    # =========================================================================
    - name: basic-chat-routing
      description: Routes simple chat to correct intent
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "Hello, how are you?"
        intents:
          - id: chat
            description: general Q&A
          - id: code_help
            description: code questions
        tags: []
      mocks:
        route-intent:
          intent: chat
          topic: "Hello, how are you?"
          tags: []
        generate-response:
          text: "Hello! I'm doing well, how can I help you?"
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: intent
            equals: "chat"
          - path: text
            contains: "Hello"

    - name: code-help-routing
      description: Routes code questions with codebase tag
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "How does authentication work?"
        intents:
          - id: chat
            description: general Q&A
          - id: code_help
            description: code questions
        tags:
          - id: codebase
            description: needs code exploration
      mocks:
        route-intent:
          intent: code_help
          topic: "How does authentication work?"
          tags: ["codebase"]
        generate-response:
          text: "Authentication is implemented using JWT tokens."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: intent
            equals: "code_help"
          - path: tags
            contains: "codebase"

    # =========================================================================
    # Knowledge Injection Tests
    # =========================================================================
    - name: knowledge-injection-by-tag
      description: Injects knowledge when tag matches
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "What can you do?"
        intents:
          - id: chat
            description: general Q&A
        tags:
          - id: capabilities
            description: user asks about capabilities
        knowledge:
          - tags: ["capabilities"]
            content: |
              ## Capabilities
              I can help with code exploration and task execution.
      mocks:
        route-intent:
          intent: chat
          topic: "What can you do?"
          tags: ["capabilities"]
        generate-response:
          text: "I can help with code exploration and task execution."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: tags
            contains: "capabilities"

    - name: knowledge-injection-by-intent
      description: Injects knowledge when intent matches
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "How does the API work?"
        intents:
          - id: chat
            description: general Q&A
          - id: code_help
            description: code questions
        knowledge:
          - intent: code_help
            content: |
              ## Code Exploration
              Use the code-explorer tool to search the codebase.
      mocks:
        route-intent:
          intent: code_help
          topic: "How does the API work?"
          tags: []
        generate-response:
          text: "The API is implemented in the handlers package."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: intent
            equals: "code_help"

    # =========================================================================
    # MCP Server Tests
    # =========================================================================
    - name: mcp-server-enabled-by-tag
      description: MCP server is enabled when tag matches
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "Get ticket TT-123"
        intents:
          - id: chat
            description: general Q&A
        tags:
          - id: jira
            description: needs Jira access
        mcp_servers:
          - tags: ["jira"]
            name: atlassian
            server:
              command: uvx
              args: ["mcp-atlassian"]
      mocks:
        route-intent:
          intent: chat
          topic: "Get ticket TT-123"
          tags: ["jira"]
        generate-response:
          text: "Here is ticket TT-123."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: tags
            contains: "jira"

    - name: mcp-server-not-enabled-without-tag
      description: MCP server is not enabled when tag doesn't match
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "Hello"
        intents:
          - id: chat
            description: general Q&A
        tags:
          - id: jira
            description: needs Jira access
        mcp_servers:
          - tags: ["jira"]
            name: atlassian
            server:
              command: uvx
              args: ["mcp-atlassian"]
      mocks:
        route-intent:
          intent: chat
          topic: "Hello"
          tags: []  # No jira tag
        generate-response:
          text: "Hello!"
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: tags
            equals: []

    # =========================================================================
    # Code Config Tests
    # =========================================================================
    - name: code-explorer-enabled-by-intent
      description: Code explorer enabled when code_help intent matches
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "How is auth implemented?"
        intents:
          - id: chat
            description: general Q&A
          - id: code_help
            description: code questions
        code_config:
          enabled: true
          architecture: "# My Architecture"
          docs_repo: "my-org/docs"
          projects:
            - id: backend
              repo: my-org/backend
              description: Backend services
      mocks:
        route-intent:
          intent: code_help
          topic: "How is auth implemented?"
          tags: []
        generate-response:
          text: "Auth is implemented in the auth package."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: intent
            equals: "code_help"

    - name: code-explorer-enabled-by-tag
      description: Code explorer enabled when codebase tag matches
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "Find the user model"
        intents:
          - id: chat
            description: general Q&A
        tags:
          - id: codebase
            description: needs code exploration
        code_config:
          enabled: true
          tags: ["codebase"]
          architecture: "# My Architecture"
          docs_repo: "my-org/docs"
          projects:
            - id: backend
              repo: my-org/backend
              description: Backend services
      mocks:
        route-intent:
          intent: chat
          topic: "Find the user model"
          tags: ["codebase"]
        generate-response:
          text: "The user model is in models/user.go."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: tags
            contains: "codebase"

    # =========================================================================
    # Unified Skills Tests (with description - skills as classification targets)
    # =========================================================================
    - name: unified-skills-classification
      description: Skills with descriptions are used for direct classification
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "Get ticket TT-123"
        intents:
          - id: chat
            description: general Q&A
        skills:
          - id: jira
            description: request references Jira tickets
            name: atlassian
            knowledge: |
              ## Jira Tools
              Use jira_get_issue to fetch tickets.
            server:
              command: uvx
              args: ["mcp-atlassian"]
          - id: zendesk
            description: request references Zendesk tickets
            name: zendesk
            knowledge: |
              ## Zendesk Tools
              Use zendesk tools for support.
            server:
              command: uvx
              args: ["zendesk-mcp"]
      mocks:
        route-intent:
          intent: chat
          topic: "Get ticket TT-123?"
          skills: ["jira"]
        generate-response:
          text: "Here is ticket TT-123."
      expect:
        calls:
          - step: route-intent
            exactly: 1
          - step: build-config
            exactly: 1
          - step: generate-response
            exactly: 1
        workflow_output:
          - path: intent
            equals: "chat"

    - name: unified-skills-with-requires
      description: Skill dependencies are automatically activated
      event: manual
      fixture: local.minimal
      workflow_input:
        question: "Create a PR to fix the bug"
        intents:
          - id: chat
            description: general Q&A
          - id: code_help
            description: code questions
        skills:
          - id: code-explorer
